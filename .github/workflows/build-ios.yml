name: Build iOS Native IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS App on Cloud Mac
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS Application (.app)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild build \
            -project VicePulse.xcodeproj \
            -scheme VicePulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/ios/build"

      - name: Package into .ipa
        working-directory: ios/build
        run: |
          mkdir -p Payload
          cp -R VicePulse.app Payload/
          zip -r VicePulse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VicePulse-iOS-App
          path: ios/build/VicePulse.ipa
          retention-days: 14
