name: Build iOS Native IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS App on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS Application (.app)
        run: |
          cd ios
          xcodebuild build \
            -project VicePulse.xcodeproj \
            -scheme VicePulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=./build

      - name: Package into .ipa
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r VicePulse.app Payload/
          zip -r VicePulse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VicePulse-iOS-App
          path: ios/build/VicePulse.ipa
          retention-days: 14
