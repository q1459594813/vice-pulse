name: VicePulse
options:
  bundleIdPrefix: com.vicepulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_NAME: VicePulse
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  VicePulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VicePulse
    info:
      path: VicePulse/Resources/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Dark
